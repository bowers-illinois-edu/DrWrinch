# Deploy the Shiny app in inst/shiny to shinyapps.io from a GitHub
# machine, so that a deploy does not need the maintainer's own computer.
#
# It runs only when someone presses "Run workflow" on the repository's
# Actions page (or uses the GitHub mobile app). It never runs on a push.
#
# Before the first run, add two repository secrets under Settings ->
# Secrets and variables -> Actions. Both come from the shinyapps.io
# dashboard, under Account -> Tokens -> Show:
#   SHINYAPPS_TOKEN
#   SHINYAPPS_SECRET
#
# The job installs DrWrinch from GitHub at the commit being deployed and
# then sources deploy.R, the same script used for a deploy from a
# laptop. rsconnect copies the installed DrWrinch into the manifest that
# shinyapps.io builds its image from. A GitHub machine starts with no R
# packages, so the copy it records is the one at this commit; a laptop
# with an older DrWrinch installed recorded the older one (HANDOFF.md,
# 2026-10-27).

on:
  workflow_dispatch:

name: deploy-shiny

# Two deploys at once would race to replace the same application.
concurrency:
  group: deploy-shiny
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Authenticated GitHub calls: the anonymous limit is 60 an hour.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYAPPS_ACCOUNT: jakebowers
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    permissions:
      contents: read
    steps:
      - name: Stop early if the shinyapps.io secrets are missing
        run: |
          if [ -z "$SHINYAPPS_TOKEN" ] || [ -z "$SHINYAPPS_SECRET" ]; then
            echo "::error::Add the repository secrets SHINYAPPS_TOKEN and SHINYAPPS_SECRET (Settings -> Secrets and variables -> Actions) and run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The packages the app loads, plus what the deploy and the tests
      # need. DrWrinch itself is installed in the next step, from GitHub,
      # because rsconnect refuses a package that carries no record of
      # where it came from.
      #
      # The names are bare on purpose. Written as "any::shiny", the
      # installer records "RemoteType: any" in the installed package.
      # renv copies that into its snapshot as the package's source, and
      # rsconnect, which knows no source called "any", then writes the
      # repository's name where its address belongs. The third run's
      # manifest showed exactly that for shiny, plotly, and remotes, the
      # three app packages that had been requested with "any::" and were
      # not also pulled in as another package's dependency. A bare name
      # is recorded as an ordinary repository package.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shiny
            bslib
            plotly
            remotes
            rsconnect
            jsonlite
            testthat

      - name: Install DrWrinch from GitHub at this commit
        run: |
          remotes::install_github(
            "bowers-illinois-edu/DrWrinch",
            ref = Sys.getenv("GITHUB_SHA"),
            upgrade = "never"
          )
          # The installed copy has to be the one in this checkout: the
          # manifest records the installed copy, and the app's files come
          # from the checkout.
          installed <- as.character(utils::packageVersion("DrWrinch"))
          checkout <- read.dcf("DESCRIPTION", fields = "Version")[[1]]
          if (!identical(installed, checkout)) {
            stop("Installed DrWrinch is ", installed,
                 " but this checkout is ", checkout, ".")
          }
          cat("Deploying DrWrinch", installed, "at", Sys.getenv("GITHUB_SHA"), "\n")
        shell: Rscript {0}

      # rsconnect lists every package the app needs by taking an renv
      # snapshot, and renv refuses to snapshot when a package named in
      # some installed package's LinkingTo field is absent. Such a
      # package supplies C++ headers at compile time only, so a binary
      # install leaves it out: the first run of this workflow stopped
      # because cpp11, which tidyr and isoband link to, was not
      # installed. This step installs whichever of them are missing, so
      # it does not depend on a list of names kept by hand.
      - name: Install compile-time dependencies that binary installs leave out
        run: |
          ip <- installed.packages()
          linked <- unlist(strsplit(ip[!is.na(ip[, "LinkingTo"]), "LinkingTo"], ","))
          # Drop version requirements such as "(>= 0.4.0)" and white space.
          linked <- unique(trimws(sub("\\(.*\\)", "", linked)))
          missing <- setdiff(linked[nzchar(linked)], rownames(ip))
          cat("Missing LinkingTo packages:",
              if (length(missing)) missing else "none", "\n")
          if (length(missing)) install.packages(missing)
          still <- setdiff(missing, rownames(installed.packages()))
          if (length(still)) stop("Could not install: ", paste(still, collapse = ", "))
        shell: Rscript {0}

      # A deploy replaces the public app, so the package's tests,
      # including the tests of the app's server, have to pass first.
      - name: Run the tests
        run: |
          testthat::test_dir(
            "tests/testthat",
            package = "DrWrinch",
            load_package = "installed",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

      # rsconnect uploads a manifest that tells shinyapps.io where to
      # fetch each package's source. The second run of this workflow got
      # as far as building the image there and stopped with "Unsupported
      # url scheme: RSPM/src/contrib/remotes_2.5.0.tar.gz": for remotes
      # the manifest held the repository's name, RSPM, where its address
      # belongs (the comment on the package list above says why). This
      # step names the repositories, so that the name RSPM, which the
      # installed binaries carry, has an address to resolve to. It then
      # writes the manifest and prints where each package comes from, and
      # it stops, before anything is uploaded, if a package from a
      # repository has no web address.
      - name: Deploy to shinyapps.io
        run: |
          Sys.unsetenv("RENV_CONFIG_REPOS_OVERRIDE")
          options(repos = c(
            RSPM = "https://packagemanager.posit.co/cran/latest",
            CRAN = "https://cloud.r-project.org"
          ))

          app_files <- c("global.R", "ui.R", "server.R",
                         "R/helpers.R", "R/curves.R", "R/plots.R")
          rsconnect::writeManifest(appDir = "inst/shiny", appFiles = app_files)
          pk <- jsonlite::read_json("inst/shiny/manifest.json")$packages
          # deploy.R names the files it uploads, and the manifest is not
          # one of them; rsconnect writes its own during the deploy.
          unlink("inst/shiny/manifest.json")
          field <- function(p, f) {
            if (is.null(p[[f]])) NA_character_ else as.character(p[[f]])
          }
          tab <- data.frame(
            package = names(pk),
            source = vapply(pk, field, "", f = "Source"),
            repository = vapply(pk, field, "", f = "Repository"),
            row.names = NULL
          )
          print(tab, right = FALSE)
          from_github <- !is.na(tab$source) & tab$source == "github"
          has_address <- !is.na(tab$repository) &
            grepl("^https?://", tab$repository)
          bad <- tab[!from_github & !has_address, ]
          if (nrow(bad) > 0) {
            stop("The manifest gives no web address for: ",
                 paste(bad$package, collapse = ", "),
                 ". Nothing was uploaded.")
          }

          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          source("deploy.R")
        shell: Rscript {0}
